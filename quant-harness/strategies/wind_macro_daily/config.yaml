name: wind_macro_daily
description: >
  Daily instrument-by-instrument multi-factor strategy for US Treasuries,
  US and China IRS plus USDCNY, USDJPY, AUDUSD and EURUSD. Each instrument
  and factor is validated separately before any optional portfolio aggregation.
engine: pandas

universe:
  [UST_2Y, UST_5Y, UST_10Y, UST_30Y, US_IRS_5Y, CN_IRS_5Y, USDCNY, USDJPY, AUDUSD, EURUSD]

data:
  mode: synthetic
  start: "2018-01-02"
  end: "2025-12-31"
  seed: 20260823
  synthetic_warning: "Engineering smoke test only; not market data or investment evidence."
  wind:
    catalog_path: "strategies/wind_macro_daily/data/series_catalog.csv"
    observations_path: "strategies/wind_macro_daily/data/clean/observations.csv"
    windpy_path: "C:/Wind/Wind.NET.Client/WindNET/x64"
  manual_excel:
    path_env: "WIND_MACRO_WORKBOOK"
    default_path: "../../Raw_wind.xlsx"
    release_dictionary: "strategies/wind_macro_daily/data/release_dictionary.yaml"
    max_price_forward_fill_business_days: 5
    minimum_macro_components: 2
    # Treasury benchmark yields are tradable rate-risk proxies and use a
    # duration return model. They are never relabelled as IRS quotes. Exact US
    # and China IRS remain unavailable until their own columns are supplied.
    price_map:
      UST_2Y: "美国:国债收益率:2年"
      UST_5Y: "美国:国债收益率:5年"
      UST_10Y: "美国:国债收益率:10年"
      UST_30Y: "美国:国债收益率:30年"
      USDCNY: "美元兑人民币"
      USDJPY: "美元兑日元"
      AUDUSD: "澳元兑美元"
      EURUSD: "欧元兑美元"
    # Signed macro-regime exposures after point-in-time transformation and
    # rolling standardization at the conservative availability timestamp.
    macro_baskets:
      UST_2Y: &us_duration_macro
        us_real_gdp_yoy: -0.15
        us_ism_manufacturing_pmi: -0.15
        us_ism_services_pmi: -0.10
        us_industrial_production_yoy: -0.10
        us_retail_sales_yoy: -0.10
        us_unemployment_u3_sa: 0.10
        us_cpi_nsa_mom: -0.10
        us_core_cpi_nsa_mom: -0.10
        us_core_pce_sa_mom: -0.05
        us_ppi_final_demand_sa_mom: -0.05
      UST_5Y: *us_duration_macro
      UST_10Y: *us_duration_macro
      UST_30Y: *us_duration_macro
      US_IRS_5Y: *us_duration_macro
      CN_IRS_5Y:
        cn_manufacturing_pmi: -0.15
        cn_industrial_production_mom: -0.15
        cn_retail_sales_yoy: -0.10
        cn_real_gdp_yoy: -0.15
        cn_cpi_mom: -0.10
        cn_ppi_mom: -0.10
        cn_tsf_stock_yoy: -0.10
        cn_m1_yoy: -0.05
        cn_m2_yoy: -0.05
        cn_home_sales_area_ytd_yoy: -0.05
      USDCNY:
        cn_manufacturing_pmi: -0.15
        cn_manufacturing_new_export_orders: -0.10
        cn_industrial_production_mom: -0.10
        cn_retail_sales_yoy: -0.10
        cn_cpi_mom: -0.05
        cn_tsf_stock_yoy: -0.05
        cn_m2_yoy: -0.05
        us_ism_manufacturing_pmi: 0.10
        us_ism_services_pmi: 0.10
        us_unemployment_u3_sa: -0.10
        us_cpi_nsa_mom: 0.05
        us_core_pce_sa_mom: 0.05
      USDJPY:
        us_ism_manufacturing_pmi: 0.20
        us_ism_services_pmi: 0.20
        us_unemployment_u3_sa: -0.20
        us_cpi_nsa_mom: 0.15
        us_core_cpi_nsa_mom: 0.15
        us_core_pce_sa_mom: 0.10
      AUDUSD:
        cn_manufacturing_pmi: 0.15
        cn_manufacturing_new_export_orders: 0.10
        cn_industrial_production_mom: 0.10
        cn_trade_balance_yoy: 0.05
        us_ism_manufacturing_pmi: -0.15
        us_ism_services_pmi: -0.15
        us_unemployment_u3_sa: 0.10
        us_cpi_nsa_mom: -0.10
        us_core_pce_sa_mom: -0.10
      EURUSD:
        us_ism_manufacturing_pmi: -0.25
        us_ism_services_pmi: -0.25
        us_unemployment_u3_sa: 0.20
        us_cpi_nsa_mom: -0.15
        us_core_cpi_nsa_mom: -0.10
        us_core_pce_sa_mom: -0.05

instruments:
  UST_2Y:
    asset_class: UST
    return_model: yield_duration
    duration: 1.9
    initial_level: 3.00
    cost_bps: 0.4
    close_dataset: us_treasury_2y
  UST_5Y:
    asset_class: UST
    return_model: yield_duration
    duration: 4.6
    initial_level: 3.00
    cost_bps: 0.5
    close_dataset: us_treasury_5y
  UST_10Y:
    asset_class: UST
    return_model: yield_duration
    duration: 8.2
    initial_level: 3.25
    cost_bps: 0.7
    close_dataset: us_treasury_10y
  UST_30Y:
    asset_class: UST
    return_model: yield_duration
    duration: 15.5
    initial_level: 3.50
    cost_bps: 1.2
    close_dataset: us_treasury_30y
  US_IRS_5Y:
    asset_class: IRS
    return_model: yield_duration
    initial_level: 3.00
    duration: 4.5
    cost_bps: 0.8
    close_dataset: us_irs_sofr_5y
  CN_IRS_5Y:
    asset_class: IRS
    return_model: yield_duration
    initial_level: 2.40
    duration: 4.4
    cost_bps: 0.8
    close_dataset: cn_irs_fr007_5y
  USDCNY:
    asset_class: FX
    return_model: log_price
    initial_level: 6.70
    cost_bps: 1.2
    close_dataset: fx_spot_usdcny
  USDJPY:
    asset_class: FX
    return_model: log_price
    initial_level: 110.0
    cost_bps: 0.8
    close_dataset: fx_spot_usdjpy
  AUDUSD:
    asset_class: FX
    return_model: log_price
    initial_level: 0.72
    cost_bps: 0.8
    close_dataset: fx_spot_audusd
  EURUSD:
    asset_class: FX
    return_model: log_price
    initial_level: 1.15
    cost_bps: 0.6
    close_dataset: fx_spot_eurusd

factors:
  fast_window: 20
  medium_window: 60
  zscore_window: 252
  signal_clip: 3.0
  weights:
    FX:
      momentum: 0.40
      carry: 0.25
      mean_reversion: 0.10
      macro: 0.25
    IRS:
      momentum: 0.40
      carry: 0.20
      mean_reversion: 0.15
      macro: 0.25
    UST:
      momentum: 0.40
      carry: 0.20
      mean_reversion: 0.15
      macro: 0.25

risk:
  annualization: 252
  volatility_window: 60
  target_volatility: 0.10
  max_instrument_leverage: 2.0
  max_portfolio_gross: 1.5

walk_forward:
  train_size: 756
  test_size: 252
  step: 252
  effectiveness:
    minimum_windows: 3
    minimum_active_position_days: 126
    minimum_average_oos_sharpe: 0.50
    minimum_worst_window_sharpe: -0.50
    minimum_positive_sharpe_fraction: 0.6666666666
    minimum_average_oos_annualized_return: 0.0
    maximum_worst_oos_drawdown: -0.20
  signal_variants:
    - momentum
    - carry_signal
    - mean_reversion
    - macro_signal
    - composite_signal

# Deliberate production bar. Synthetic smoke output is not tuned to pass it.
gate:
  min_sharpe: 0.5
  max_drawdown: -0.20
  max_turnover: 1.5
