schema_version: 1
as_of: "2026-08-23"
workbook:
  price_sheet: "Price_raw"
  macro_sheet: "Macro"
  header_row: 2
  unit_row: 3
  macro_update_row: 4
  price_data_start_row: 4
  macro_data_start_row: 5

decision_clock:
  timezone: "Asia/Hong_Kong"
  decision_time: "16:30:00"
  rule: >
    A release at or before the Hong Kong decision cutoff is usable in that
    session; a later, weekend, or date-only release is first usable on the
    following Hong Kong business day.

vintage_policy:
  workbook_vintage: "current_revised_snapshot"
  release_timing_guard: "conservative_rule_plus_latest_official_reconciliation"
  strict_point_in_time_eligible: false
  reason: >
    Row 4 records only the latest update date for each column. It does not
    contain the historical release timestamp or the value vintage that was
    known on every prior date. The rules below block reference-date look-ahead,
    but a real-time vintage source is still required to eliminate revision
    leakage completely.
  production_rule: >
    Treat results as research-only until every macro observation has an exact
    release timestamp and vintage_id from an archived release or vendor
    point-in-time database.

