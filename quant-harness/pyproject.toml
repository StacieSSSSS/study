[project]
name = "quant-harness"
version = "0.1.0"
description = "Standardized harness for developing and validating quant strategies"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pick per strategy via config.yaml's `engine:` field — not all strategies need all of these.
vectorbt = ["vectorbt"]
backtrader = ["backtrader"]
zipline = ["zipline-reloaded"]
dev = ["pytest>=8.0", "ruff>=0.6", "pyright>=1.1"]
# strategies/fx_correlation: live data + cointegration testing + report rendering.
fx_correlation = [
    "yfinance>=0.2",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "tabulate>=0.9",
    "matplotlib>=3.8",
]
# strategies/wind_macro_daily uses base dependencies; WindPy is installed by
# the licensed Wind terminal and is intentionally not a PyPI dependency.
wind_macro_daily = []

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["core", "strategies", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
