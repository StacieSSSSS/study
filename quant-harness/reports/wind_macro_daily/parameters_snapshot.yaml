name: wind_macro_daily
description: >
  Daily multi-factor strategy for US and China IRS plus USDCNY, USDJPY,
  AUDUSD and EURUSD. Combines price/rate momentum, carry, mean reversion
  and macro regime signals with volatility targeting.
engine: pandas

universe: [US_IRS_5Y, CN_IRS_5Y, USDCNY, USDJPY, AUDUSD, EURUSD]

data:
  mode: synthetic
  start: "2018-01-02"
  end: "2025-12-31"
  seed: 20260823
  synthetic_warning: "Engineering smoke test only; not market data or investment evidence."
  wind:
    catalog_path: "strategies/wind_macro_daily/data/series_catalog.csv"
    observations_path: "strategies/wind_macro_daily/data/clean/observations.csv"
    windpy_path: "C:/Wind/Wind.NET.Client/WindNET/x64"
  manual_excel:
    path_env: "WIND_MACRO_WORKBOOK"
    default_path: "../../Raw_wind.xlsx"
    release_dictionary: "strategies/wind_macro_daily/data/release_dictionary.yaml"
    max_price_forward_fill_business_days: 5
    minimum_macro_components: 2
    # The workbook does not contain exact US or China IRS quotes. Do not label
    # Treasury yields as swaps: the real-data run is therefore FX-only until
    # US_IRS_5Y and CN_IRS_5Y are added explicitly.
    price_map:
      USDCNY: "美元兑人民币"
      USDJPY: "美元兑日元"
      AUDUSD: "澳元兑美元"
      EURUSD: "欧元兑美元"
    # Signed macro-regime exposures. Each input is first transformed and
    # rolling-standardized at its conservative availability timestamp.
    macro_baskets:
      USDCNY:
        cn_manufacturing_pmi: -0.15
        cn_manufacturing_new_export_orders: -0.10
        cn_industrial_production_mom: -0.10
        cn_retail_sales_yoy: -0.10
        cn_cpi_mom: -0.05
        cn_tsf_stock_yoy: -0.05
        cn_m2_yoy: -0.05
        us_ism_manufacturing_pmi: 0.10
        us_ism_services_pmi: 0.10
        us_unemployment_u3_sa: -0.10
        us_cpi_nsa_mom: 0.05
        us_core_pce_sa_mom: 0.05
      USDJPY:
        us_ism_manufacturing_pmi: 0.20
        us_ism_services_pmi: 0.20
        us_unemployment_u3_sa: -0.20
        us_cpi_nsa_mom: 0.15
        us_core_cpi_nsa_mom: 0.15
        us_core_pce_sa_mom: 0.10
      AUDUSD:
        cn_manufacturing_pmi: 0.15
        cn_manufacturing_new_export_orders: 0.10
        cn_industrial_production_mom: 0.10
        cn_trade_balance_yoy: 0.05
        us_ism_manufacturing_pmi: -0.15
        us_ism_services_pmi: -0.15
        us_unemployment_u3_sa: 0.10
        us_cpi_nsa_mom: -0.10
        us_core_pce_sa_mom: -0.10
      EURUSD:
        us_ism_manufacturing_pmi: -0.25
        us_ism_services_pmi: -0.25
        us_unemployment_u3_sa: 0.20
        us_cpi_nsa_mom: -0.15
        us_core_cpi_nsa_mom: -0.10
        us_core_pce_sa_mom: -0.05

instruments:
  US_IRS_5Y:
    asset_class: IRS
    initial_level: 3.00
    duration: 4.5
    cost_bps: 0.8
    close_dataset: us_irs_sofr_5y
  CN_IRS_5Y:
    asset_class: IRS
    initial_level: 2.40
    duration: 4.4
    cost_bps: 0.8
    close_dataset: cn_irs_fr007_5y
  USDCNY:
    asset_class: FX
    initial_level: 6.70
    cost_bps: 1.2
    close_dataset: fx_spot_usdcny
  USDJPY:
    asset_class: FX
    initial_level: 110.0
    cost_bps: 0.8
    close_dataset: fx_spot_usdjpy
  AUDUSD:
    asset_class: FX
    initial_level: 0.72
    cost_bps: 0.8
    close_dataset: fx_spot_audusd
  EURUSD:
    asset_class: FX
    initial_level: 1.15
    cost_bps: 0.6
    close_dataset: fx_spot_eurusd

factors:
  fast_window: 20
  medium_window: 60
  zscore_window: 252
  signal_clip: 3.0
  weights:
    FX:
      momentum: 0.40
      carry: 0.25
      mean_reversion: 0.10
      macro: 0.25
    IRS:
      momentum: 0.40
      carry: 0.20
      mean_reversion: 0.15
      macro: 0.25

risk:
  annualization: 252
  volatility_window: 60
  target_volatility: 0.10
  max_instrument_leverage: 2.0
  max_portfolio_gross: 1.5

walk_forward:
  train_size: 756
  test_size: 252
  step: 252
  signal_variants:
    - momentum
    - carry_signal
    - mean_reversion
    - macro_signal
    - composite_signal

# Deliberate production bar. Synthetic smoke output is not tuned to pass it.
gate:
  min_sharpe: 0.5
  max_drawdown: -0.20
  max_turnover: 1.5
